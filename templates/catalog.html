
<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

<h2>Student Record</h2>

<table border="1" cellpadding="10">

    <caption>Student Details</caption>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>1</td>
        <td>Ali</td>
        <td>HTML</td>
        <td>90</td>
    </tr>

    <tr>
        <td>2</td>
        <td>Ahmed</td>
        <td>CSS</td>
        <td>85</td>
    </tr>

    <tr>
        <td>3</td>
        <td colspan="2">Hussain - Web Development</td>
        <td>95</td>
    </tr>

    <tr>
        <td rowspan="2">4</td>
        <td>Usman</td>
        <td>JavaScript</td>
        <td>88</td>
    </tr>

    <tr>
        <td>Hamza</td>
        <td>Python</td>
        <td>92</td>
    </tr>

</table>

</body>
</html>
