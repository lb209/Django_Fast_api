<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 50px; display: flex; justify-content: center; }
        .container { width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-buttons { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #777; }
        .tab-btn.active { color: #007bff; border-bottom: 2px solid #007bff; margin-bottom: -2px; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button[type="submit"] { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button[type="submit"]:hover { background: #0056b3; }
        .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-top: 0;">Welcome Portal</h2>

    <!-- Error Message -->
    {% if error %}
        <div class="error-msg">{{ error }}</div>
    {% endif %}

    <!-- Tabs -->
    <div class="tab-buttons">
        <button class="tab-btn {% if tab != 'login' %}active{% endif %}" onclick="switchTab('signup')">Sign Up</button>
        <button class="tab-btn {% if tab == 'login' %}active{% endif %}" onclick="switchTab('login')">Login</button>
    </div>

    <!-- 1. Signup Form (Name, Email, Password) -->
    <form id="signup-form" class="form-section {% if tab != 'login' %}active{% endif %}" method="POST">
        {% csrf_token %}
        <input type="hidden" name="action" value="signup">
        
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="name" placeholder="Apna naam likhein..." required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" placeholder="Apni email likhein..." required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" placeholder="Password likhein..." required>
        </div>
        <button type="submit">Register</button>
    </form>

    <!-- 2. Login Form (Email, Password) -->
    <form id="login-form" class="form-section {% if tab == 'login' %}active{% endif %}" method="POST">
        {% csrf_token %}
        <input type="hidden" name="action" value="login">
        
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" placeholder="Apni email likhein..." required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" placeholder="Password likhein..." required>
        </div>
        <button type="submit">Login</button>
    </form>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));

        if (tabName === 'signup') {
            document.querySelector('.tab-buttons button:nth-child(1)').classList.add('active');
            document.getElementById('signup-form').classList.add('active');
        } else {
            document.querySelector('.tab-buttons button:nth-child(2)').classList.add('active');
            document.getElementById('login-form').classList.add('active');
        }
    }
</script>

</body>
</html>
